services:
  library-book:
    build: .
    # Or use a prebuilt image once you publish one:
    # image: ghcr.io/hansenidden18/library-book:latest
    container_name: library-book
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Single data volume: SQLite db, library files, covers, and the
      # import/ watch folder all live here. Set DATA_PATH in .env to keep
      # it on a dedicated disk; drop files into $DATA_PATH/import
      # (or $DATA_PATH/import/papers) to auto-import them.
      - ${DATA_PATH:-./data}:/data
    environment:
      TZ: "${TZ:-UTC}"
      USER_ID: "${USER_ID:-1000}"
      GROUP_ID: "${GROUP_ID:-1000}"
      WATCH_ENABLED: "true"
      METADATA_FETCH_ENABLED: "true"
      # Recommended: set your email for the Crossref "polite pool".
      CROSSREF_MAILTO: "${CROSSREF_MAILTO:-}"
      # Optional: a Google Books API key raises rate limits.
      GOOGLE_BOOKS_API_KEY: "${GOOGLE_BOOKS_API_KEY:-}"
      LOG_LEVEL: "info"

  # Optional: give the library its own Tailscale node, so it answers on
  # https://<TS_HOSTNAME>.<your-tailnet>.ts.net instead of sharing a host
  # and origin with whatever else that machine serves. Its own origin means
  # the PWA installs cleanly at "/" with its own storage and service worker.
  # Start it with:  docker compose --profile tailscale up -d
  tailscale:
    profiles: ["tailscale"]
    image: tailscale/tailscale:latest
    container_name: library-book-ts
    restart: unless-stopped
    # Share the app's network namespace so serve can reach 127.0.0.1:8000.
    network_mode: "service:library-book"
    environment:
      TS_HOSTNAME: "${TS_HOSTNAME:-library}"
      TS_STATE_DIR: "/var/lib/tailscale"
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: "/config/serve.json"
      # Only authenticate when there is no saved node identity, so a restart
      # never re-runs `tailscale up` against an already-registered node.
      TS_AUTH_ONCE: "true"
      # Strongly recommended. The image gives interactive login only 60s
      # before it kills tailscaled and restarts with a fresh URL, which
      # loops forever if nobody clicks in time. An auth key skips that.
      TS_AUTHKEY: "${TS_AUTHKEY:-}"
    volumes:
      # Node identity lives beside the data, so restoring on a new machine
      # brings the hostname back with it.
      - ${TS_STATE_PATH:-./tailscale/state}:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro
